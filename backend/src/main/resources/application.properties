spring.application.name=SmartBankManager
server.servlet.context-path=/api

# Overridden entirely at startup if DATABASE_URL is set (see DatabaseUrlEnvironmentPostProcessor).
# Otherwise built from these separate parts - handy for local dev without a full connection string.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_bank_manager}
spring.datasource.username=${DB_USER:smart_bank_app}
spring.datasource.password=${DB_PASSWORD:smart_bank_dev_pw}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-3f8a9c2e7b1d4f6081a2c3e4f5061728}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

app.loan.manager-approval-threshold=${LOAN_MANAGER_APPROVAL_THRESHOLD:500000}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.mvc.problemdetails.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.storage.kyc-documents-dir=${KYC_STORAGE_DIR:./data/kyc-documents}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Comma-separated list of frontend origins allowed to call this API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Render/Railway/Heroku-style platforms set PORT; default to 8080 for local dev.
server.port=${PORT:8080}
